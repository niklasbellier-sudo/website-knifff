# Kniff — static site, no framework build. For Git-linked or CLI deploys this
# runs scripts/netlify-build.sh to assemble a clean _site/ (scripts, planning
# notes and raw masters stay out). For a drag-and-drop deploy, drop the _site
# folder itself (run `bash scripts/netlify-build.sh` first).

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# --- headers ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/scenes/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- form success page ---------------------------------------------------
[[redirects]]
  from = "/danke"
  to = "/danke.html"
  status = 200
