<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --sc-canvas: #0b0d0e;
      --sc-ink: #f3f0ea;
      --sc-ink-soft: #9ba09f;
      --sc-accent: #f2a63b;
      --sc-font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --sc-font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    body { margin: 0; }
    a { color: var(--sc-accent); } a:hover { color: #d8902c; }

    .stage {
      position: relative; width: 100%; height: 100%; box-sizing: border-box;
      background: var(--sc-canvas); color: var(--sc-ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.6rem; overflow: hidden; padding: 3rem 2rem;
      font-family: var(--sc-font-display);
    }
    .stage::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse 62% 52% at 50% 40%,
        color-mix(in oklab, var(--sc-accent) 16%, transparent), transparent 70%);
      pointer-events: none;
    }
    .hero-bulb { position: relative; width: min(300px, 42vw); aspect-ratio: 100 / 140; }
    .eyebrow {
      position: relative; margin: 0; font-family: var(--sc-font-mono); font-size: 0.85rem;
      letter-spacing: 0.04em; color: var(--sc-accent);
    }
  </style>
</helmet>
<div class="stage">
  <div class="hero-bulb">
    <dc-import name="BulbIcon" tile="{{false}}" hint-size="300,420"></dc-import>
  </div>
  <p class="eyebrow">Die Kniff-Idee</p>
</div>
</x-dc>
</body>
</html>
